[package]
name = "bootcontrold"
version.workspace = true
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true

# `--all-features` enables `polkit-mock`, which intentionally compiles out the
# production Polkit client. A default-feature cargo-udeps run verifies that the
# dependency is live on the real authorization path.
[package.metadata.cargo-udeps.ignore]
normal = ["zbus_polkit"]

[features]
polkit-mock = []

[dependencies]
bootcontrol-core = { workspace = true }
zbus            = { version = "5", default-features = false, features = ["tokio"] }
tokio           = { version = "1", features = ["full"] }
tracing         = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix             = { version = "0.29", features = ["fs"] }
libc            = "0.2"
chrono          = { version = "0.4", default-features = false, features = ["std", "clock"] }
which           = { workspace = true }
zbus_polkit     = "5.1"
serde           = { workspace = true }
serde_json      = { workspace = true }
tempfile = "3"

[lib]
name = "bootcontrold"
path = "src/lib.rs"

[[bin]]
name = "bootcontrold"
path = "src/main.rs"
