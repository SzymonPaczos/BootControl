name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # BootControl testing environment vars
  BOOTCONTROL_BUS: session

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - beta

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.toolchain }}
        components: rustfmt, clippy
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libdbus-1-dev libfontconfig1-dev
        
    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Check Formatting
      run: cargo fmt --all -- --check
      
    - name: Run Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      
    - name: Run Tests
      run: cargo test --workspace --all-features

  # ── E2E test job ────────────────────────────────────────────────────────────
  # Runs the workspace-level integration test binary (`tests/e2e/`) against a
  # live bootcontrold subprocess on the D-Bus session bus.
  #
  # Separate from `build` so fast unit tests and slow E2E tests are distinct
  # in the CI dashboard, and so E2E failures do not block the matrix run.
  #
  # Linux-only: D-Bus session bus + POSIX flock semantics are not available on
  # macOS or Windows runners.
  e2e:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v3

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        components: clippy

    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-e2e-
          ${{ runner.os }}-cargo-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y dbus dbus-x11 \
            pkg-config libdbus-1-dev libfontconfig1-dev

    - name: Clippy — E2E test code
      run: cargo clippy -p bootcontrol-e2e --tests -- -D warnings

    # `dbus-launch` in a separate step only survives the lifetime of that
    # step's shell — by the time `Run E2E tests` starts the daemon is gone
    # and `Connection::session()` fails with "address error: Invalid
    # address". `dbus-run-session` (from dbus-x11) spawns a fresh session
    # bus that lives for the duration of the wrapped command, then tears
    # it down cleanly. No GITHUB_ENV plumbing needed.
    - name: Run E2E tests
      env:
        BOOTCONTROL_BUS: session
      run: |
        dbus-run-session -- \
          cargo test -p bootcontrol-e2e --test e2e -- --ignored --nocapture
